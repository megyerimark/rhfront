<div style="background-color: #0a0a0a; min-height: 90vh; color: white; padding: 40px; font-family: sans-serif;">
  
  <h1 style="text-align: center; text-transform: uppercase; letter-spacing: 3px; color: #fff; margin-bottom: 40px;">
    ⚡ Közelgő Rave-ek ⚡
  </h1>

  <!-- Bulik rácsos elrendezése (Grid) -->
  <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; max-width: 1200px; margin: 0 auto;">
    
    <!-- Az Angular új, szupergyors cikluskezelője -->
    @for (party of parties; track party.id) {
      <div style="background-color: #151515; border: 1px solid #222; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.6); transition: 0.3s;">
        
        <!-- Buli kártya tartalma -->
        <div style="padding: 25px;">
          <h3 style="margin: 0 0 10px 0; color: #ff4444; text-transform: uppercase; letter-spacing: 1px; font-size: 20px;">
            {{ party.title }}
          </h3>
          
          <p style="color: #888; font-size: 13px; margin: 0 0 15px 0; font-weight: bold;">
            📍 {{ party.location }} | 📅 {{ party.date }}
          </p>
          
          <p style="color: #ccc; line-height: 1.5; font-size: 14px; min-height: 60px;">
            {{ party.description }}
          </p>
          
          <!-- Alsó sáv gombbal és stílussal -->
          <div style="margin-top: 25px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #222; padding-top: 15px;">
            <span style="background-color: #222; color: #aaa; padding: 6px 12px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;">
              Industrial
            </span>
            <button style="background-color: white; color: black; border: none; padding: 8px 16px; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; font-size: 11px; letter-spacing: 1px;">
              Megnézem
            </button>
          </div>
        </div>

      </div>
    } @empty {
      <!-- Ez jelenik meg, ha a tömbünk még teljesen üres -->
      <div style="grid-column: 1 / -1; text-align: center; color: #666; padding: 60px; font-style: italic; border: 1px dashed #222; border-radius: 8px;">
        Jelenleg nincsenek aktív bulik a rendszerben... Csinálj egyet a backendről!
      </div>
    }

  </div>

</div>
