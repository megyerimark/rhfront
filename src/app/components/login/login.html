<div style="display: flex; justify-content: center; align-items: center; height: 80vh; font-family: sans-serif;">
  
  <div style="background-color: #1a1a1a; padding: 40px; border-radius: 8px; width: 350px; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
    <h2 style="text-align: center; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 1px;">Belépés</h2>

    <!-- Ha van hibaüzenet, itt írjuk ki pirossal -->
    @if (errorMessage) {
      <div style="background-color: #ff4444; color: white; padding: 10px; border-radius: 4px; margin-bottom: 20px; text-align: center;">
        {{ errorMessage }}
      </div>
    }

    <form (ngSubmit)="onLogin()">
      <div style="margin-bottom: 20px;">
        <label style="display: block; margin-bottom: 8px; color: #aaa;">Email cím</label>
        <!-- Az [(ngModel)] köti össze a mezőt a TypeScript változóval! -->
        <input type="email" name="email" [(ngModel)]="email" required 
               style="width: 100%; padding: 10px; box-sizing: border-box; background-color: #333; border: none; color: white; border-radius: 4px;">
      </div>

      <div style="margin-bottom: 30px;">
        <label style="display: block; margin-bottom: 8px; color: #aaa;">Jelszó</label>
        <input type="password" name="password" [(ngModel)]="password" required
               style="width: 100%; padding: 10px; box-sizing: border-box; background-color: #333; border: none; color: white; border-radius: 4px;">
      </div>

      <button type="submit" 
              style="width: 100%; padding: 12px; background-color: white; color: black; border: none; font-weight: bold; text-transform: uppercase; cursor: pointer; border-radius: 4px;">
        Bejelentkezés
      </button>
    </form>
  </div>

</div>
