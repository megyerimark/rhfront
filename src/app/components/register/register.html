<div style="background-color: #0a0a0a; min-height: 90vh; display: flex; justify-content: center; align-items: center; font-family: sans-serif; color: white;">
  
  <div style="background-color: #111; padding: 40px; border-radius: 8px; border: 1px solid #222; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
    
    <h2 style="text-align: center; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px; color: #fff;">
      ⚡ Regisztráció ⚡
    </h2>

    <!-- Hibaüzenet -->
    @if (errorMessage) {
      <div style="background-color: #ff4444; color: white; padding: 12px; border-radius: 4px; margin-bottom: 20px; font-weight: bold; text-align: center; font-size: 14px;">
        ⚠️ {{ errorMessage }}
      </div>
    }

    <!-- Siker üzenet -->
    @if (successMessage) {
      <div style="background-color: #00c851; color: white; padding: 12px; border-radius: 4px; margin-bottom: 20px; font-weight: bold; text-align: center; font-size: 14px;">
        ✓ {{ successMessage }}
      </div>
    }

    <!-- Form -->
    <form (ngSubmit)="onRegister()">
      
      <!-- Teljes név -->
      <div style="margin-bottom: 20px;">
        <label style="display: block; margin-bottom: 8px; text-transform: uppercase; font-size: 12px; color: #aaa; letter-spacing: 1px;">Teljes név</label>
        <input type="text" name="name" [(ngModel)]="name" required
               style="width: 100%; padding: 12px; background-color: #222; border: 1px solid #333; border-radius: 4px; color: white; font-size: 14px; box-sizing: border-box;">
      </div>

      <!-- Email -->
      <div style="margin-bottom: 20px;">
        <label style="display: block; margin-bottom: 8px; text-transform: uppercase; font-size: 12px; color: #aaa; letter-spacing: 1px;">Email cím</label>
        <input type="email" name="email" [(ngModel)]="email" required
               style="width: 100%; padding: 12px; background-color: #222; border: 1px solid #333; border-radius: 4px; color: white; font-size: 14px; box-sizing: border-box;">
      </div>

      <!-- Jelszó -->
      <div style="margin-bottom: 20px;">
        <label style="display: block; margin-bottom: 8px; text-transform: uppercase; font-size: 12px; color: #aaa; letter-spacing: 1px;">Jelszó</label>
        <input type="password" name="password" [(ngModel)]="password" required
               style="width: 100%; padding: 12px; background-color: #222; border: 1px solid #333; border-radius: 4px; color: white; font-size: 14px; box-sizing: border-box;">
      </div>

      <!-- Jelszó újra -->
      <div style="margin-bottom: 30px;">
        <label style="display: block; margin-bottom: 8px; text-transform: uppercase; font-size: 12px; color: #aaa; letter-spacing: 1px;">Jelszó megerősítése</label>
        <input type="password" name="password_confirmation" [(ngModel)]="password_confirmation" required
               style="width: 100%; padding: 12px; background-color: #222; border: 1px solid #333; border-radius: 4px; color: white; font-size: 14px; box-sizing: border-box;">
      </div>

      <!-- Küldés gomb -->
      <button type="submit" 
              style="width: 100%; padding: 12px; background-color: white; color: black; border: none; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; border-radius: 4px; cursor: pointer; font-size: 14px;">
        Fiók létrehozása
      </button>

    </form>

  </div>

</div>
