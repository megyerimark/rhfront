<div class="rh-auth-wrapper">
  
  <div class="auth-card">
    <h2 class="auth-title">⚡ Regisztráció ⚡</h2>

    @if (errorMessage) {
      <div class="alert alert-error">
        ⚠️ {{ errorMessage }}
      </div>
    }

    @if (successMessage) {
      <div class="alert alert-success">
        ✓ {{ successMessage }}
      </div>
    }

    <form (ngSubmit)="onRegister()">
      
      <div class="form-group">
        <label>Teljes név</label>
        <input type="text" name="name" [(ngModel)]="name" required class="rh-input">
      </div>

      <div class="form-group">
        <label>Email cím</label>
        <input type="email" name="email" [(ngModel)]="email" required class="rh-input">
      </div>

      <div class="form-group">
        <label>Jelszó</label>
        <input type="password" name="password" [(ngModel)]="password" required class="rh-input">
      </div>

      <div class="form-group" style="margin-bottom: 30px;">
        <label>Jelszó megerősítése</label>
        <input type="password" name="password_confirmation" [(ngModel)]="password_confirmation" required class="rh-input">
      </div>

      <button type="submit" class="rh-btn">Fiók létrehozása</button>

    </form>
  </div>

</div>
