<div style="background-color: #0a0a0a; min-height: 90vh; display: flex; justify-content: center; align-items: center; font-family: sans-serif; color: white;">
  
  <div style="background-color: #111; padding: 40px; border-radius: 8px; border: 1px solid #222; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center;">
    
    <h2 style="text-transform: uppercase; letter-spacing: 2px; margin-bottom: 25px; color: #fff;">
      RaveHouse verification
    </h2>

    <div [style.color]="isError ? '#ff4444' : '#00c851'" 
         style="font-size: 16px; font-weight: bold; line-height: 1.6; min-height: 50px;">
      {{ message }}
    </div>

  </div>

</div>
